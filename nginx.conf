# Redirection HTTP vers HTTPS
server {
    listen 80;
    server_name tourdefrance-theseries.com www.tourdefrance-theseries.com;
    
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }
    
    location / {
        return 301 https://$host$request_uri;
    }
}

# Configuration HTTPS
server {
    listen 443 ssl http2;
    server_name tourdefrance-theseries.com www.tourdefrance-theseries.com;
    
    root /usr/share/nginx/html;
    index index.html;

    # Certificats SSL
    ssl_certificate /etc/letsencrypt/live/tourdefrance-theseries.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/tourdefrance-theseries.com/privkey.pem;
    
    # Configuration SSL moderne
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers off;
    
    # Compression gzip
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/xml text/javascript application/x-javascript application/xml+rss application/javascript application/json;
    
    # Cache des assets statiques
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
    
    # Gestion du routing React (SPA)
    location / {
        try_files $uri $uri/ /index.html;
    }
    
    # Headers de sécurité
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
}